name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build, size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Licenses are allowed and docs/licenses.md is current
        run: npm run licenses && git diff --exit-code docs/licenses.md

  export-files:
    name: Export files open in other apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Writer opens the Word files. Math reads their equations. Poppler reads the text and fonts of each PDF.
      - name: Install LibreOffice Writer and Math, and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-math poppler-utils
      - run: npx vitest run tests/unit/docx-libreoffice.test.ts tests/unit/pdf-export.test.ts tests/unit/epub-export.test.ts
        env:
          VLO_REQUIRE_LIBREOFFICE: '1'
          VLO_REQUIRE_POPPLER: '1'

  e2e:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}
      # The runner has no sound card. Firefox and WebKit play Web Audio only to a real output, so a
      # PulseAudio null sink gives them a silent one, as a computer with speakers would.
      - name: Start a silent sound output
        if: matrix.project == 'firefox' || matrix.project == 'webkit'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio gstreamer1.0-pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
