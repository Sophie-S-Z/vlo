<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Vlo is a free, local-first writing app for novelists, memoirists and poets."
    />
    <title>Vlo</title>
    <meta name="theme-color" content="#0e0d0c" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      (function () {
        var t = 'system';
        var c = false;
        try {
          var p = JSON.parse(localStorage.getItem('vlo:preferences') || '{}');
          if (['ink', 'paper', 'sepia', 'contrast'].indexOf(p.theme) >= 0) t = p.theme;
          c = p.calm === true;
        } catch (e) {}
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.calm = String(c);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
